<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donjon to TaleSpire Converter</title>
    <link rel="stylesheet" href="001 styles.css">
</head>
<body>

    <h2>Donjon to TaleSpire Converter</h2>
    
    <input type="file" id="jsonFileInput" accept=".json, .txt">
    <button id="uploadButton">Generate TaleSpire Slab</button>

    <div>
        <h3>Your TaleSpire String:</h3>
        <textarea id="outputArea" rows="10" readonly placeholder="Your generated string will appear here..."></textarea>
    </div>

    <div id="map-grid"></div>

    <div>
        <h3>Slab Builder Raw Output:</h3>
        <textarea id="SlabOutputArea" rows="10" readonly placeholder="The Raw Output will appear here..."></textarea>
    </div>

    <script src="https://cdn.jsdelivr.net/pako/1.0.3/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/6.6.4/math.min.js"></script>

    <script src="talespireslabs.js"></script> 
    <script src="donjonParser.js"></script>  
    <script src="slabBuilder.js"></script>   
    <script src="main.js"></script>

</body>
</html>
